<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>RENATO VISION 3D AI</title>

<style>
:root{
    --accent:#ffffff;
    --accent2:#8b5cf6;
    --bg:#050507;
    --panel:rgba(12,12,17,.94);
    --button:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.14);
    --text:#fff;
    --muted:#9b9ba5;
    --shadow:0 25px 80px rgba(0,0,0,.65);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--text);
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    color:inherit;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* CAMERA */

#camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;

    transition:
    transform .12s linear,
    filter .15s linear;
}

/* 3D OVERLAY */

#depthOverlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    z-index:8;

    mix-blend-mode:screen;

    transition:.25s;
}

#depthOverlay.active{
    opacity:.28;
}

.depthRed{
    box-shadow:
    inset 0 0 80px rgba(255,0,0,.18);
}

.depthBlue{
    box-shadow:
    inset 0 0 80px rgba(0,160,255,.18);
}

/* TOP */

#top{
    position:absolute;
    z-index:50;

    top:
    calc(
        env(safe-area-inset-top,0px)
        + 12px
    );

    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.glass{
    background:
    rgba(8,8,12,.55);

    border:
    1px solid
    rgba(255,255,255,.12);

    backdrop-filter:
    blur(24px);

    -webkit-backdrop-filter:
    blur(24px);

    box-shadow:
    0 10px 35px
    rgba(0,0,0,.28);
}

.brand{
    padding:9px 12px;
    border-radius:15px;

    font-size:10px;
    font-weight:950;
    letter-spacing:1.8px;
}

#status{
    padding:9px 12px;
    border-radius:15px;

    font-size:9px;
    font-weight:900;
    letter-spacing:1px;
}

/* 3D BADGE */

#threeBadge{
    position:absolute;
    top:
    calc(
        env(safe-area-inset-top,0px)
        + 65px
    );

    left:50%;
    transform:translateX(-50%);

    z-index:60;

    padding:8px 14px;
    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        rgba(255,0,60,.75),
        rgba(0,120,255,.75)
    );

    border:1px solid rgba(255,255,255,.2);

    font-size:10px;
    font-weight:950;

    letter-spacing:1px;

    display:none;
}

#threeBadge.show{
    display:block;
}

/* RECORD */

#recording{
    display:none;

    position:absolute;
    top:
    calc(
        env(safe-area-inset-top,0px)
        + 65px
    );

    left:50%;
    transform:translateX(-50%);

    z-index:70;

    padding:8px 14px;
    border-radius:20px;

    background:rgba(130,0,0,.85);

    font-size:10px;
    font-weight:900;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff2020;
    margin-right:6px;

    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:.2}
}

/* BOTTOM */

#bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    z-index:80;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;

    padding:
    15px 14px
    calc(
        18px +
        env(safe-area-inset-bottom,0px)
    );

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.82)
    );
}

.circle{
    width:55px;
    height:55px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    rgba(15,15,18,.78);

    border:
    1px solid
    rgba(255,255,255,.16);

    backdrop-filter:blur(20px);

    font-size:20px;
}

.circle:active{
    transform:scale(.9);
}

#capture{
    width:82px;
    height:82px;

    border:
    5px solid rgba(255,255,255,.95);

    background:rgba(255,255,255,.08);
}

#capture span{
    width:62px;
    height:62px;

    border-radius:50%;
    background:#fff;

    transition:.2s;
}

#capture.three span{
    background:
    linear-gradient(
        90deg,
        #ff253f 0 48%,
        #fff 48% 52%,
        #1595ff 52% 100%
    );
}

#capture.recording span{
    width:32px;
    height:32px;
    border-radius:7px;
    background:#ff2020;
}

/* MENU */

#menu{
    position:absolute;
    z-index:100;

    right:14px;

    bottom:
    calc(
        120px +
        env(safe-area-inset-bottom,0px)
    );

    padding:12px 16px;

    border-radius:17px;

    background:
    rgba(8,8,12,.78);

    border:1px solid var(--border);

    backdrop-filter:blur(22px);

    font-size:10px;
    font-weight:950;
    letter-spacing:1px;
}

/* HIDDEN */

.hidden{
    opacity:0!important;
    pointer-events:none!important;
}

/* PANELS */

.panel{
    position:absolute;

    left:8px;
    right:8px;
    bottom:8px;

    max-height:90vh;

    z-index:200;

    padding:15px;

    overflow:auto;

    border-radius:28px;

    background:var(--panel);

    backdrop-filter:blur(35px);
    -webkit-backdrop-filter:blur(35px);

    border:1px solid var(--border);

    box-shadow:var(--shadow);

    transform:translateY(120%);
    opacity:0;
    pointer-events:none;

    transition:.3s ease;
}

.panel.open{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
}

.panelHeader{
    position:sticky;
    top:-15px;
    z-index:10;

    margin:-15px -15px 15px;

    padding:14px 15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:var(--panel);

    border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.panelTitle{
    font-size:16px;
    font-weight:950;
    letter-spacing:1px;
}

.close{
    width:43px;
    height:43px;

    border-radius:50%;

    border:1px solid var(--border);

    background:var(--button);

    font-size:27px;
}

/* SECTIONS */

.section{
    margin-top:17px;
}

.sectionTitle{
    margin-bottom:9px;

    color:var(--muted);

    font-size:9px;
    font-weight:950;

    letter-spacing:1.5px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.option{
    min-height:50px;

    border-radius:15px;

    border:1px solid var(--border);

    background:var(--button);

    font-size:10px;
    font-weight:850;
}

.option.active{
    border-color:var(--accent);
    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.16),
        rgba(255,255,255,.05)
    );
}

/* 3D BUTTON */

.threeButton{
    width:100%;
    min-height:62px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.2);

    background:
    linear-gradient(
        110deg,
        rgba(255,0,45,.18),
        rgba(0,90,255,.2)
    );

    font-weight:950;
    letter-spacing:.6px;
}

.threeButton.active{
    box-shadow:
    0 0 25px rgba(70,130,255,.2);
}

/* SELECT */

select{
    width:100%;
    min-height:49px;

    padding:10px;

    border-radius:15px;

    border:1px solid var(--border);

    background:var(--button);

    color:#fff;

    outline:none;
}

/* RANGE */

.control{
    display:grid;
    grid-template-columns:75px 1fr 48px;
    gap:8px;
    align-items:center;

    margin:12px 0;
}

.control label{
    font-size:10px;
}

.control input{
    width:100%;
    accent-color:var(--accent2);
}

.value{
    text-align:right;
    color:#999;
    font-size:9px;
}

/* FILTER CARDS */

.filterStrip{
    display:flex;
    gap:9px;

    overflow-x:auto;

    padding-bottom:5px;

    scrollbar-width:none;
}

.filterStrip::-webkit-scrollbar{
    display:none;
}

.filterCard{
    flex:0 0 86px;
    height:70px;

    border-radius:15px;

    border:1px solid var(--border);

    background:
    linear-gradient(
        135deg,
        #222,
        #090909
    );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-size:8px;
    font-weight:900;
}

.filterCard.active{
    border-color:#fff;
}

/* THEME PREVIEW */

.themeGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.themeCard{
    position:relative;

    min-height:105px;

    border-radius:18px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.12);

    text-align:left;

    background:#111;

    transition:.2s;
}

.themeCard:active{
    transform:scale(.97);
}

.themePreview{
    position:absolute;
    inset:0;

    padding:10px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.themeMiniTop{
    display:flex;
    justify-content:space-between;
}

.themeMiniDot{
    width:13px;
    height:13px;
    border-radius:50%;
}

.themeMiniButton{
    height:20px;
    width:52px;
    border-radius:8px;
}

.themeName{
    position:absolute;
    left:10px;
    bottom:9px;

    font-size:9px;
    font-weight:950;

    text-shadow:
    0 2px 7px #000;
}

@media(min-width:700px){

    .panel{
        left:auto;
        right:20px;
        width:460px;
    }

    .themeGrid{
        grid-template-columns:repeat(3,1fr);
    }
}

/* GALLERY */

#gallery{
    position:absolute;
    inset:0;

    z-index:400;

    background:#050507;

    transform:translateX(100%);

    transition:.3s ease;

    overflow:auto;

    padding:
    calc(15px + env(safe-area-inset-top,0px))
    12px
    calc(20px + env(safe-area-inset-bottom,0px));
}

#gallery.open{
    transform:translateX(0);
}

.galleryHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:14px;
}

.galleryTitle{
    font-size:21px;
    font-weight:950;
}

.galleryTools{
    display:flex;
    gap:7px;
}

.smallButton{
    min-height:40px;

    padding:0 12px;

    border-radius:13px;

    border:1px solid var(--border);

    background:var(--button);

    font-size:9px;
    font-weight:900;
}

.galleryTabs{
    display:flex;
    gap:7px;
    margin-bottom:12px;
}

.galleryTab{
    flex:1;
    min-height:42px;

    border-radius:13px;

    border:1px solid var(--border);

    background:var(--button);

    font-size:9px;
    font-weight:900;
}

.galleryTab.active{
    background:#fff;
    color:#000;
}

.galleryGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.galleryItem{
    position:relative;

    aspect-ratio:1;

    overflow:hidden;

    border-radius:9px;

    background:#111;
}

.galleryItem img,
.galleryItem video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.badge{
    position:absolute;
    bottom:5px;
    left:5px;

    padding:4px 6px;

    border-radius:6px;

    background:rgba(0,0,0,.72);

    font-size:7px;
    font-weight:950;
}

.delete{
    position:absolute;
    top:5px;
    right:5px;

    width:27px;
    height:27px;

    border-radius:50%;

    border:0;

    background:rgba(0,0,0,.72);

    color:#fff;
}

/* VIEWER */

#viewer{
    position:fixed;
    inset:0;

    z-index:700;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.97);
}

#viewer.open{
    display:flex;
}

#viewerContent{
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:50px 12px;
}

#viewerContent img,
#viewerContent video{
    max-width:100%;
    max-height:88%;

    object-fit:contain;
}

#viewerContent.threeD{
    perspective:900px;
}

.viewer3D{
    position:relative;

    max-width:94%;
    max-height:82%;

    transform-style:preserve-3d;

    animation:float3d 4s ease-in-out infinite;
}

.viewer3D img{
    display:block;
    max-width:100%;
    max-height:80vh;
}

.viewer3D .red{
    position:absolute;
    inset:0;

    transform:translateX(-8px);

    mix-blend-mode:screen;

    opacity:.5;

    filter:
    sepia(1)
    saturate(6)
    hue-rotate(315deg);
}

.viewer3D .blue{
    position:absolute;
    inset:0;

    transform:translateX(8px);

    mix-blend-mode:screen;

    opacity:.5;

    filter:
    sepia(1)
    saturate(6)
    hue-rotate(175deg);
}

@keyframes float3d{
    0%,100%{
        transform:
        rotateY(-2deg)
        rotateX(1deg)
        translateZ(0);
    }

    50%{
        transform:
        rotateY(2deg)
        rotateX(-1deg)
        translateZ(15px);
    }
}

.viewerClose{
    position:absolute;

    z-index:10;

    top:
    calc(
        14px +
        env(safe-area-inset-top,0px)
    );

    right:14px;

    width:44px;
    height:44px;

    border-radius:50%;

    border:1px solid var(--border);

    background:#18181b;

    color:#fff;

    font-size:25px;
}

/* TOAST */

#toast{
    position:absolute;

    left:50%;

    bottom:
    calc(
        112px +
        env(safe-area-inset-bottom,0px)
    );

    transform:translate(-50%,20px);

    z-index:900;

    padding:11px 15px;

    border-radius:15px;

    background:rgba(0,0,0,.86);

    border:1px solid var(--border);

    font-size:10px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    white-space:nowrap;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* LOADING */

#loading{
    position:absolute;
    inset:0;

    z-index:1000;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:13px;

    background:#000;
}

.loader{
    width:43px;
    height:43px;

    border:3px solid rgba(255,255,255,.12);

    border-top-color:#fff;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

#loadingText{
    color:#999;

    font-size:10px;
    font-weight:850;

    letter-spacing:1px;
}
</style>
</head>

<div id="app">

<video id="camera"
autoplay
muted
playsinline
webkit-playsinline></video>

    <div class="brand glass">

<button

</div>

<div class="section">

id="ai">

<!-- THEMES -->

<div class="panelHeader">

<div class="panelTitle">
🎨 TEMAS
</div>

<button
class="close"
id="closeThemes">
×
</button>

</div>

<div
class="themeGrid"
id="themeGrid">
</div>

</div>


<!-- GALLERY -->

<div id="gallery">

<div class="galleryHeader">

<div class="galleryTitle">
MINHA GALERIA
</div>

<div class="galleryTools">

<button
class="smallButton"
id="importGallery">
＋ IMPORTAR
</button>

<button
class="smallButton"
id="closeGallery">
×
</button>

</div>

</div>


<div class="galleryTabs">

<button
class="galleryTab active"
data-filter="all">

/* =====================================================
DATABASE
===================================================== */

function openDB(){

    return new Promise((resolve,reject)=>{

        const req =
        indexedDB.open(
            "RenatoVision3D",
            1
        );

        req.onupgradeneeded=e=>{

            const d=e.target.result;

            if(
                !d.objectStoreNames.contains(
                    "media"
                )
            ){

                d.createObjectStore(
                    "media",
                    {
                        keyPath:"id"
                    }
                );

            }

        };

        req.onsuccess=e=>{
            db=e.target.result;
            resolve();
        };

        req.onerror=()=>{
            reject(req.error);
        };

    });

}


/* =====================================================
SALVAR
===================================================== */

function saveMedia(blob,type,extra={}){

    return new Promise((resolve,reject)=>{

        const tx=
        db.transaction(
            "media",
            "readwrite"
        );

        tx.objectStore("media").put({

            id:
            Date.now()+
            Math.random(),

            blob,

            type,

            threeD:
            !!extra.threeD,

            filter:
            currentFilter,

            created:
            Date.now()

        });

        tx.oncomplete=resolve;

        tx.onerror=()=>{
            reject(tx.error);
        };

    });

}


/* =====================================================
LISTAR
===================================================== */

function getMedia(){

    return new Promise((resolve,reject)=>{

        const tx=
        db.transaction(
            "media",
            "readonly"
        );

        const req=
        tx.objectStore("media")
        .getAll();

        req.onsuccess=()=>{

            const data=req.result||[];

            data.sort(
                (a,b)=>
                b.created-a.created
            );

            resolve(data);

        };

        req.onerror=()=>{
            reject(req.error);
        };

    });

}

DELETE

function deleteItem(id){

    return new Promise(resolve=>{

        const tx=
        db.transaction(
            "media",
            "readwrite"
        );

        tx.objectStore("media")
        .delete(id);

        tx.oncomplete=resolve;

    });

}

/* =====================================================

===================================================== */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(t=>t.stop());

        }

        const fps=
        Number(
            document.getElementById("fps").value
        );

        stream=
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:facing,

                width:{
                    ideal:3840
                },

                height:{
                    ideal:2160
                },

                frameRate:{
                    ideal:fps,
                    max:fps
                }
            },

            audio:true

        });

        camera.srcObject=stream;

        await camera.play();

        document.getElementById(
            "loading"
        ).style.display="none";

        updateCamera();

        showToast(
            "Câmera pronta"
        );

    }catch(e){

        console.error(e);

        document.getElementById(
            "loadingText"
        ).textContent=
        "PERMITA O ACESSO À CÂMERA";

    }

}

/* =====================================================
CAPTURA FOTO
===================================================== */

capture.onclick=async()=>{

    if(recording){

        stopRecording();
        return;

    }

    showToast(
        threeMode
        ?
        "Criando foto 3D..."
        :
        "Processando foto..."
    );

    menu.classList.add("hidden");

    await new Promise(
        r=>requestAnimationFrame(r)
    );

    if(
        !camera.videoWidth ||
        !camera.videoHeight
    ){

        showToast("Câmera indisponível");

        menu.classList.remove("hidden");

        return;

    }


    canvas.width=
    camera.videoWidth;

    canvas.height=
    camera.videoHeight;


    ctx.save();

    ctx.filter=
    getFilter();

    const z=
    Number(zoom.value);

    const w=
    canvas.width*z;

    const h=
    canvas.height*z;

    const x=
    (canvas.width-w)/2;

    const y=
    (canvas.height-h)/2;

    ctx.drawImage(
        camera,
        x,
        y,
        w,
        h
    );

    ctx.restore();


    if(aiEnabled){

        processAI();

    }


    let blob;


    if(threeMode){

        blob=
        await create3DPhoto();

    }else{

        blob=
        await canvasToBlob(
            canvas,
            "image/jpeg",
            .96
        );

    }


    await saveMedia(
        blob,
        "photo",
        {
            threeD:threeMode
        }
    );


    showToast(
        threeMode
        ?
        "🧊 FOTO 3D SALVA NA GALERIA"
        :
        "📸 FOTO SALVA NA GALERIA"
    );


    setTimeout(()=>{
        menu.classList.remove("hidden");
    },900);

};


/* =====================================================
AI LOCAL
===================================================== */

function processAI(){

    const image=
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const d=image.data;

    for(
        let i=0;
        i<d.length;
        i+=4
    ){

        const r=d[i];
        const g=d[i+1];
        const b=d[i+2];

        const lum=
        .2126*r+
        .7152*g+
        .0722*b;

        let boost=0;

        if(lum<65){

            boost=
            (65-lum)*.13;

        }

        d[i]=Math.max(
            0,
            Math.min(
                255,
                (r-128)*1.025+
                128+
                boost
            )
        );

        d[i+1]=Math.max(
            0,
            Math.min(
                255,
                (g-128)*1.025+
                128+
                boost
            )
        );

        d[i+2]=Math.max(
            0,
            Math.min(
                255,
                (b-128)*1.025+
                128+
                boost
            )
        );

    }

    ctx.putImageData(
        image,
        0,
        0
    );

}

/* =====================================================
CRIAR FOTO 3D
===================================================== */

async function create3DPhoto(){

    /*
    Cria uma composição estereoscópica
    simulada.

    A imagem esquerda e direita
    recebem deslocamentos pequenos,
    produzindo um efeito anaglífico
    vermelho/ciano.
    */

    const width=
    canvas.width;

    const height=
    canvas.height;


    const output=
    document.createElement("canvas");

    output.width=width;
    output.height=height;

    const octx=
    output.getContext("2d");


    const left=
    document.createElement("canvas");

    left.width=width;
    left.height=height;

    const lctx=
    left.getContext("2d");


    const right=
    document.createElement("canvas");

    right.width=width;
    right.height=height;

    const rctx=
    right.getContext("2d");


    /*
    Olho esquerdo
    */

    lctx.drawImage(
        canvas,
        -7,
        0
    );


    /*
    Olho direito
    */

    rctx.drawImage(
        canvas,
        7,
        0
    );


    const L=
    lctx.getImageData(
        0,
        0,
        width,
        height
    );

    const R=
    rctx.getImageData(
        0,
        0,
        width,
        height
    );


    const result=
    octx.createImageData(
        width,
        height
    );


    for(
        let i=0;
        i<result.data.length;
        i+=4
    ){

        /*
        Canal vermelho
        vem do olho esquerdo.
        */

        result.data[i]=
        L.data[i];


        /*
        Verde + azul
        vêm do olho direito.
        */

        result.data[i+1]=
        R.data[i+1];

        result.data[i+2]=
        R.data[i+2];

        result.data[i+3]=255;

    }


    octx.putImageData(
        result,
        0,
        0
    );


    return await canvasToBlob(
        output,
        "image/jpeg",
        .96
    );

}


/* =====================================================
VÍDEO
===================================================== */

document.getElementById("videoButton")
.onclick=()=>{

    if(recording){

        stopRecording();

    }else{

        startRecording();

    }

};


function startRecording(){

    if(
        !stream ||
        typeof MediaRecorder==="undefined"
    ){

        showToast(
            "Gravação não suportada"
        );

        return;

    }


    try{

        const fps=
        Number(
            document.getElementById("fps").value
        );

        const videoStream=
        camera.captureStream
        ?
        camera.captureStream(fps)
        :
        stream;


        let mime="";


        const types=[
            "video/mp4",
            "video/webm;codecs=vp9",
            "video/webm"
        ];


        for(
            const t of types
        ){

            if(
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(t)
            ){

                mime=t;
                break;

            }

        }


        recorder=
        new MediaRecorder(
            videoStream,
            mime
            ?
            {mimeType:mime}
            :
            undefined
        );


        chunks=[];


        recorder.ondataavailable=e=>{

            if(e.data.size){

                chunks.push(e.data);

            }

        };


        recorder.onstop=async()=>{

            const blob=
            new Blob(
                chunks,
                {
                    type:
                    recorder.mimeType
                    ||
                    "video/webm"
                }
            );


            await saveMedia(
                blob,
                "video"
            );


            showToast(
                "🎥 VÍDEO SALVO"
            );

        };


        recorder.start(500);


        recording=true;

        capture.classList.add(
            "recording"
        );

        document
        .getElementById("recording")
        .style.display="block";

        menu.classList.add("hidden");

        showToast(
            "🎥 Gravação iniciada"
        );

    }catch(e){

        console.error(e);

        showToast(
            "Erro na gravação"
        );

    }

}


function stopRecording(){

    if(
        recorder &&
        recorder.state!=="inactive"
    ){

        recorder.stop();

    }

    recording=false;

    capture.classList.remove(
        "recording"
    );

    document
    .getElementById("recording")
    .style.display="none";

    menu.classList.remove(
        "hidden"
    );

}

document.getElementById("fileInput")
.onchange=async e=>{

    const files=
    [...e.target.files];

    for(
        const file of files
    ){

        if(
            file.type.startsWith("image/")
        ){

            await saveMedia(
                file,
                "photo"
            );

        }else if(
            file.type.startsWith("video/")
        ){

            await saveMedia(
                file,
                "video"
            );

        }

    }


    showToast(
        files.length+
        " arquivo(s) importado(s)"
    );


    if(gallery.classList.contains("open")){

        await loadGallery();

    }

    e.target.value="";

};

/* =====================================================
CARREGAR GALERIA
===================================================== */

async function loadGallery(){

    galleryGrid.innerHTML="";

    const items=
    await getMedia();


    const filtered=
    items.filter(item=>{

        if(
            currentGalleryFilter==="all"
        ){
            return true;
        }

        return item.type===
        currentGalleryFilter;

    });


    if(!filtered.length){

        galleryGrid.innerHTML=`

        <div style="
        grid-column:1/-1;
        text-align:center;
        padding:70px 20px;
        color:#777;
        font-size:11px;
        ">

        NENHUM ARQUIVO

        <br><br>

        Capture uma foto,
        grave um vídeo ou
        importe arquivos.

        </div>

        `;

        return;

    }


    filtered.forEach(item=>{

        const element=
        document.createElement("div");

        element.className=
        "galleryItem";


        const url=
        URL.createObjectURL(
            item.blob
        );


        let media;


        if(
            item.type==="photo"
        ){

            media=
            document.createElement("img");

        }else{

            media=
            document.createElement("video");

            media.muted=true;
            media.playsInline=true;

        }


        media.src=url;

        element.appendChild(media);


        const badge=
        document.createElement("div");

        badge.className="badge";

        badge.textContent=
        item.type==="photo"
        ?
        (
            item.threeD
            ?
            "🧊 FOTO 3D"
            :
            "FOTO"
        )
        :
        "VÍDEO";

        element.appendChild(badge);


        const del=
        document.createElement("button");

        del.className="delete";

        del.textContent="×";


        del.onclick=async e=>{

            e.stopPropagation();

            await deleteItem(
                item.id
            );

            URL.revokeObjectURL(
                url
            );

            await loadGallery();

        };


        element.appendChild(del);


        element.onclick=()=>{

            openViewer(
                item,
                url
            );

        };


        galleryGrid.appendChild(
            element
        );

    });

}


/* =====================================================
VIEWER
===================================================== */

function openViewer(
    item,
    url
){

    viewerContent.innerHTML="";

    viewerContent.className="";


    if(
        item.type==="photo" &&
        item.threeD
    ){

        viewerContent.classList.add(
            "threeD"
        );


        const box=
        document.createElement("div");

        box.className="viewer3D";


        const base=
        document.createElement("img");

        base.src=url;


        const red=
        document.createElement("img");

        red.src=url;

        red.className="red";


        const blue=
        document.createElement("img");

        blue.src=url;

        blue.className="blue";


        box.appendChild(base);
        box.appendChild(red);
        box.appendChild(blue);

        viewerContent.appendChild(box);

    }else{

        let media;


        if(
            item.type==="photo"
        ){

            media=
            document.createElement("img");

        }else{

            media=
            document.createElement("video");

            media.controls=true;
            media.autoplay=true;
            media.playsInline=true;

        }


        media.src=url;

        viewerContent.appendChild(
            media
        );

    }


    viewer.classList.add(
        "open"
    );

}


document.getElementById("closeViewer")
.onclick=()=>{

    viewer.classList.remove(
        "open"
    );

    viewerContent.innerHTML="";

};


/* =====================================================
PINÇA DE ZOOM
===================================================== */

let initialDistance=0;
let initialZoom=1;

document
.getElementById("app")
.addEventListener(
"touchstart",
e=>{

    if(
        e.touches.length===2
    ){

        const dx=
        e.touches[0].clientX-
        e.touches[1].clientX;

        const dy=
        e.touches[0].clientY-
        e.touches[1].clientY;

        initialDistance=
        Math.hypot(dx,dy);

        initialZoom=
        Number(zoom.value);

    }

},
{passive:true}
);


document
.getElementById("app")
.addEventListener(
"touchmove",
e=>{

    if(
        e.touches.length!==2
    )return;


    const dx=
    e.touches[0].clientX-
    e.touches[1].clientX;

    const dy=
    e.touches[0].clientY-
    e.touches[1].clientY;

    const distance=
    Math.hypot(dx,dy);


    if(!initialDistance)return;


    let value=
    initialZoom*
    distance/
    initialDistance;


    value=
    Math.max(
        1,
        Math.min(
            8,
            value
        )
    );


    zoom.value=value;

    updateValues();

},
{passive:true}
);


/* =====================================================
DESLIZAR PARA FILTROS
===================================================== */

let swipeX=0;

camera.addEventListener(
"touchstart",
e=>{

    if(
        e.touches.length===1
    ){

        swipeX=
        e.touches[0].clientX;

    }

},
{passive:true}
);


camera.addEventListener(
"touchend",
e=>{

    const end=
    e.changedTouches[0].clientX;

    const diff=
    end-swipeX;


    if(
        Math.abs(diff)<60
    )return;


    let index=
    filters.findIndex(
        x=>x[0]===currentFilter
    );


    if(diff<0){

        index++;

        if(index>=filters.length){
            index=0;
        }

    }else{

        index--;

        if(index<0){
            index=filters.length-1;
        }

    }


    currentFilter=
    filters[index][0];


    document
    .querySelectorAll(".filterCard")
    .forEach(b=>{
        b.classList.toggle(
            "active",
            b.dataset.filter===currentFilter
        );
    });


    updateCamera();


    showToast(
        filters[index][1]
    );

},
{passive:true}
);

}

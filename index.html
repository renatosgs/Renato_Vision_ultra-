<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Renato Vision AI">

<meta name="theme-color" content="#050507">

<title>RENATO VISION AI</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#050507;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}

body{
    overscroll-behavior:none;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    color:inherit;
}

button:active{
    transform:scale(.96);
}

/* =========================================================
   APP
========================================================= */

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#050507;
    isolation:isolate;
}

/* =========================================================
   CAMERA
========================================================= */

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;

    transform-origin:center center;

    transition:
        filter .16s ease,
        transform .12s ease;
}

/* =========================================================
   CINEMATIC OVERLAY
========================================================= */

#cinematic{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:5;

    background:
        radial-gradient(
            circle at center,
            transparent 42%,
            rgba(0,0,0,.12) 100%
        );

    opacity:.8;
}

/* =========================================================
   TOP BAR
========================================================= */

#top{
    position:absolute;

    top:
        calc(
            env(safe-area-inset-top,0px)
            + 12px
        );

    left:14px;
    right:14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:30;

    pointer-events:none;
}

.glass{
    background:
        rgba(10,10,14,.54);

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(24px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(150%);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.28);
}

.brand{
    padding:9px 12px;

    border-radius:15px;

    font-size:9px;
    font-weight:950;

    letter-spacing:2px;
}

.status{
    padding:9px 12px;

    border-radius:15px;

    font-size:9px;
    font-weight:900;

    letter-spacing:1px;
}

/* =========================================================
   FOCUS
========================================================= */

#focusBox{
    position:absolute;

    width:70px;
    height:70px;

    border:
        1px solid
        rgba(255,255,255,.75);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    opacity:0;

    z-index:20;

    pointer-events:none;

    transition:
        opacity .2s,
        transform .25s;
}

#focusBox.show{
    opacity:1;
    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   RECORDING
========================================================= */

#recording{
    position:absolute;

    top:
        calc(
            env(safe-area-inset-top,0px)
            + 68px
        );

    left:50%;

    transform:translateX(-50%);

    display:none;

    z-index:40;

    padding:8px 14px;

    border-radius:20px;

    background:
        rgba(130,0,0,.78);

    border:
        1px solid
        rgba(255,255,255,.15);

    font-size:10px;
    font-weight:950;
}

.recDot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ff2020;

    margin-right:6px;

    animation:
        blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:.25;
    }
}

/* =========================================================
   FILTER NAME
========================================================= */

#filterName{
    position:absolute;

    left:50%;

    bottom:
        calc(
            150px +
            env(safe-area-inset-bottom,0px)
        );

    transform:
        translateX(-50%)
        translateY(10px);

    z-index:25;

    padding:7px 12px;

    border-radius:15px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:blur(15px);

    font-size:9px;
    font-weight:900;

    opacity:0;

    transition:.25s;

    pointer-events:none;
}

#filterName.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   BOTTOM CAMERA
========================================================= */

#bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:22px;

    padding:
        14px
        16px
        calc(
            18px +
            env(safe-area-inset-bottom,0px)
        );

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.72)
        );
}

.camButton{
    width:54px;
    height:54px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(15,15,18,.72);

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:blur(18px);

    font-size:20px;
}

#capture{
    width:82px;
    height:82px;

    border:
        5px solid
        rgba(255,255,255,.95);

    background:
        rgba(255,255,255,.08);
}

#capture span{
    width:62px;
    height:62px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

#capture.recording span{
    width:31px;
    height:31px;

    border-radius:8px;

    background:#ff2020;
}

/* =========================================================
   MENU BUTTON
========================================================= */

#menuButton{
    position:absolute;

    right:14px;

    bottom:
        calc(
            122px +
            env(safe-area-inset-bottom,0px)
        );

    z-index:70;

    padding:12px 15px;

    border-radius:18px;

    background:
        rgba(8,8,11,.68);

    border:
        1px solid
        rgba(255,255,255,.14);

    backdrop-filter:blur(20px);

    font-size:9px;
    font-weight:950;

    letter-spacing:1px;
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden{
    opacity:0!important;
    pointer-events:none!important;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
    position:absolute;

    left:8px;
    right:8px;
    bottom:8px;

    z-index:200;

    max-height:
        calc(
            92vh -
            env(safe-area-inset-top,0px)
        );

    overflow:auto;

    padding:16px;

    border-radius:28px;

    background:
        rgba(9,9,13,.96);

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(35px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(160%);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.85);

    transform:translateY(120%);

    opacity:0;

    pointer-events:none;

    transition:.3s ease;
}

.panel.open{
    transform:translateY(0);

    opacity:1;

    pointer-events:auto;
}

/* =========================================================
   PANEL HEADER
========================================================= */

.panelHeader{
    position:sticky;

    top:-16px;

    z-index:10;

    margin:
        -16px
        -16px
        15px
        -16px;

    padding:14px 16px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        rgba(9,9,13,.96);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.panelTitle{
    font-size:16px;
    font-weight:950;
    letter-spacing:1px;
}

.close{
    width:43px;
    height:43px;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.16);

    font-size:26px;
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
    margin-top:17px;
}

.sectionTitle{
    margin-bottom:8px;

    color:#999;

    font-size:9px;

    font-weight:950;

    letter-spacing:1.4px;
}

/* =========================================================
   BUTTONS
========================================================= */

.mainButton{
    width:100%;

    min-height:50px;

    padding:10px 13px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #222227,
            #111115
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size:11px;
    font-weight:900;

    text-align:left;
}

.grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.option{
    min-height:49px;

    border-radius:14px;

    background:#17171c;

    border:
        1px solid
        rgba(255,255,255,.09);

    font-size:9px;

    font-weight:850;
}

.option.active{
    border-color:
        rgba(255,255,255,.55);

    background:#303038;
}

/* =========================================================
   SELECT
========================================================= */

select{
    width:100%;

    min-height:48px;

    padding:10px;

    color:#fff;

    background:#17171c;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:14px;

    outline:none;
}

/* =========================================================
   RANGE
========================================================= */

.control{
    display:grid;

    grid-template-columns:
        78px
        1fr
        48px;

    align-items:center;

    gap:8px;

    margin:11px 0;
}

.control label{
    font-size:9px;
    color:#ccc;
}

.control input{
    width:100%;
    accent-color:#fff;
}

.value{
    color:#888;
    font-size:9px;
    text-align:right;
}

/* =========================================================
   THEME GRID
========================================================= */

.themeGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.themeCard{
    min-height:74px;

    border-radius:17px;

    position:relative;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:#17171b;

    text-align:left;

    padding:10px;

    display:flex;
    align-items:flex-end;

    font-size:9px;
    font-weight:950;

    letter-spacing:.5px;
}

.themeCard::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            var(--a),
            var(--b)
        );

    opacity:.9;

    z-index:-1;
}

.themeCard span{
    position:relative;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.8);
}

.themeCard.active{
    outline:
        2px solid
        rgba(255,255,255,.85);
}

/* =========================================================
   GALLERY
========================================================= */

#gallery{
    position:absolute;
    inset:0;

    z-index:400;

    overflow:auto;

    padding:
        calc(
            14px +
            env(safe-area-inset-top,0px)
        )
        12px
        calc(
            20px +
            env(safe-area-inset-bottom,0px)
        );

    background:#050507;

    transform:translateX(100%);

    transition:.3s ease;
}

#gallery.open{
    transform:translateX(0);
}

.galleryTop{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.galleryTitle{
    font-size:23px;
    font-weight:950;
}

.galleryActions{
    display:flex;
    gap:7px;
}

.iconButton{
    width:43px;
    height:43px;

    border-radius:50%;

    background:#18181d;

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size:19px;
}

.galleryTabs{
    display:flex;

    gap:7px;

    overflow-x:auto;

    margin-bottom:13px;

    scrollbar-width:none;
}

.galleryTabs::-webkit-scrollbar{
    display:none;
}

.galleryTab{
    flex:0 0 auto;

    padding:9px 14px;

    border-radius:16px;

    background:#15151a;

    color:#aaa;

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size:9px;
    font-weight:900;
}

.galleryTab.active{
    color:#fff;

    background:#303038;

    border-color:
        rgba(255,255,255,.35);
}

.galleryGrid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:5px;
}

.galleryItem{
    position:relative;

    aspect-ratio:1;

    overflow:hidden;

    border-radius:9px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.06);
}

.galleryItem img,
.galleryItem video{
    width:100%;
    height:100%;

    object-fit:cover;
}

.mediaType{
    position:absolute;

    left:6px;
    bottom:6px;

    padding:4px 6px;

    border-radius:7px;

    background:
        rgba(0,0,0,.7);

    font-size:7px;
    font-weight:950;
}

.delete{
    position:absolute;

    right:5px;
    top:5px;

    width:27px;
    height:27px;

    border-radius:50%;

    background:
        rgba(0,0,0,.72);

    font-size:16px;
}

/* =========================================================
   IMPORT INPUT
========================================================= */

#importInput{
    display:none;
}

/* =========================================================
   VIEWER
========================================================= */

#viewer{
    position:fixed;
    inset:0;

    z-index:800;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.98);
}

#viewer.open{
    display:flex;
}

#viewerMedia{
    max-width:100%;
    max-height:100%;

    object-fit:contain;
}

#viewerClose{
    position:absolute;

    right:15px;

    top:
        calc(
            15px +
            env(safe-area-inset-top,0px)
        );

    width:45px;
    height:45px;

    border-radius:50%;

    background:#202026;

    font-size:25px;

    z-index:10;
}

#viewer3D{
    position:absolute;

    left:50%;
    top:50%;

    width:min(92vw,700px);
    max-height:80vh;

    transform:
        translate(-50%,-50%);

    display:none;

    perspective:1000px;

    touch-action:none;
}

#viewer3D.active{
    display:block;
}

#viewer3D img{
    display:block;

    width:100%;
    max-height:80vh;

    object-fit:contain;

    border-radius:15px;

    transform:
        rotateX(var(--rx,0deg))
        rotateY(var(--ry,0deg))
        scale(1.03);

    transition:
        transform .08s linear;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.8);
}

#viewerControls{
    position:absolute;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom,0px)
        );

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    z-index:20;
}

.viewerBtn{
    padding:10px 14px;

    border-radius:16px;

    background:
        rgba(25,25,30,.85);

    border:
        1px solid
        rgba(255,255,255,.14);

    font-size:9px;
    font-weight:900;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
    position:absolute;

    left:50%;

    bottom:
        calc(
            108px +
            env(safe-area-inset-bottom,0px)
        );

    transform:
        translate(-50%,20px);

    z-index:1000;

    padding:10px 14px;

    border-radius:15px;

    background:
        rgba(0,0,0,.84);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size:9px;
    font-weight:850;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    white-space:nowrap;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   LOADING
========================================================= */

#loading{
    position:absolute;
    inset:0;

    z-index:2000;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:13px;

    background:#050507;
}

.loader{
    width:44px;
    height:44px;

    border:
        3px solid
        rgba(255,255,255,.1);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loadingText{
    font-size:9px;
    color:#888;
    font-weight:900;
    letter-spacing:1px;
}

/* =========================================================
   THEME VARIABLES
========================================================= */

body.theme-neon{
    --accent:#00f5ff;
}

body.theme-luxury{
    --accent:#d6ad62;
}

body.theme-violet{
    --accent:#9b7cff;
}

body.theme-ocean{
    --accent:#35b9ff;
}

body.theme-forest{
    --accent:#5bd18c;
}

body.theme-sunset{
    --accent:#ff7b47;
}

body.theme-rose{
    --accent:#ff6d9a;
}

body.theme-ice{
    --accent:#9ce8ff;
}

body.theme-cyber{
    --accent:#55ff9b;
}

body.theme-gold{
    --accent:#ffd45c;
}

body.theme-red{
    --accent:#ff3344;
}

body.theme-monochrome{
    --accent:#fff;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .panel{
        left:auto;
        right:20px;
        width:460px;
    }

    .themeGrid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .galleryGrid{
        grid-template-columns:
            repeat(5,1fr);
    }

}

</style>
</head>

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        muted
        playsinline
        webkit-playsinline>
    </video>

    <div id="cinematic"></div>

    <div id="top">

        <div class="brand glass">
            RENATO VISION AI
        </div>

        <div
            id="status"
            class="status glass">
            CAMERA
        </div>

    </div>

    <div id="focusBox"></div>

    <div id="recording">
        <span class="recDot"></span>
        REC
        <span id="recordTime">00:00</span>
    </div>

    <div id="filterName"></div>

    <div id="bottom">

        <button
            class="camButton"
            id="galleryQuick">
            🖼️
        </button>

        <button
            class="camButton"
            id="flip">
            ↻
        </button>

        <button
            id="capture"
            class="camButton">
            <span></span>
        </button>

        <button
            class="camButton"
            id="videoButton">
            🎥
        </button>

        <button
            class="camButton"
            id="menuQuick">
            ☰
        </button>

    </div>

    <button id="menuButton">
        ☰ MENU
    </button>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <div
        id="mainPanel"
        class="panel">

        <div class="panelHeader">

            <div class="panelTitle">
                RENATO VISION AI
            </div>

            <button
                class="close"
                id="closeMenu">
                ×
            </button>

        </div>


        <div class="section">

            <div class="sectionTitle">
                APARÊNCIA DO APLICATIVO
            </div>

            <button
                class="mainButton"
                id="openThemes">
                ✨ 90 TEMAS VISUAIS
            </button>

        </div>


        <div class="section">

            <div class="sectionTitle">
                CÂMERA
            </div>

            <select id="resolution">

                <option value="native">
                    AUTOMÁTICA / NATIVA
                </option>

                <option value="1920x1080">
                    FULL HD — 1920 × 1080
                </option>

                <option value="3840x2160">
                    4K UHD — 3840 × 2160
                </option>

            </select>

            <br><br>

            <select id="fps">

                <option value="24">
                    24 FPS — CINEMA
                </option>

                <option value="30" selected>
                    30 FPS
                </option>

                <option value="60">
                    60 FPS
                </option>

            </select>

        </div>


        <div class="section">

            <div class="sectionTitle">
                VELOCIDADE DO VÍDEO
            </div>

            <div class="grid">

                <button
                    class="option active"
                    data-speed="1">
                    1× NORMAL
                </button>

                <button
                    class="option"
                    data-speed=".5">
                    0.5× LENTO
                </button>

                <button
                    class="option"
                    data-speed=".25">
                    0.25× SUPER LENTO
                </button>

                <button
                    class="option"
                    data-speed="2">
                    2× RÁPIDO
                </button>

            </div>

        </div>


        <div class="section">

            <div class="sectionTitle">
                PROCESSAMENTO
            </div>

            <div class="grid">

                <button
                    class="option active"
                    id="ai">
                    🧠 AI LOCAL
                </button>

                <button
                    class="option"
                    id="night">
                    🌙 NOTURNO
                </button>

                <button
                    class="option"
                    id="superZoom">
                    🔭 SUPER ZOOM
                </button>

                <button
                    class="option"
                    id="threeD">
                    🧊 FOTO 3D
                </button>

            </div>

        </div>


        <div class="section">

            <div class="sectionTitle">
                CONTROLE DE IMAGEM
            </div>

            <div class="control">

                <label>Brilho</label>

                <input
                    id="brightness"
                    type="range"
                    min=".5"
                    max="1.8"
                    step=".01"
                    value="1">

                <span
                    class="value"
                    id="brightnessValue">

/* =========================================================

function openDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    "RenatoVisionPremium",
                    1
                );

            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;

                    if(
                        !database.objectStoreNames.contains(
                            "media"
                        )
                    ){

                        database.createObjectStore(
                            "media",
                            {
                                keyPath:"id"
                            }
                        );

                    }

                };

            request.onsuccess =
                event => {

                    db =
                        event.target.result;

                    resolve(db);

                };

            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =========================================================
   SAVE MEDIA
========================================================= */

function saveMedia(
    blob,
    type,
    is3D=false
){

    return new Promise(
        (resolve,reject)=>{

            if(!db){

                reject(
                    new Error(
                        "DB indisponível"
                    )
                );

                return;

            }

            const tx =
                db.transaction(
                    "media",
                    "readwrite"
                );

            tx.objectStore(
                "media"
            ).put({

                id:
                    Date.now()
                    +
                    Math.random(),

                blob,

                type,

                is3D,

                created:
                    Date.now()

            });

            tx.oncomplete =
                resolve;

            tx.onerror =
                () =>
                    reject(
                        tx.error
                    );

        }
    );

}


/* =========================================================
   GET MEDIA
========================================================= */

function getMedia(){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "media",
                    "readonly"
                );

            const req =
                tx.objectStore(
                    "media"
                ).getAll();

            req.onsuccess =
                () => {

                    const list =
                        req.result || [];

                    list.sort(
                        (a,b) =>
                            b.created -
                            a.created
                    );

                    resolve(list);

                };

            req.onerror =
                () =>
                    reject(
                        req.error
                    );

        }
    );

}


/* =========================================================
   DELETE
========================================================= */

function removeMedia(id){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "media",
                    "readwrite"
                );

            tx.objectStore(
                "media"
            ).delete(id);

            tx.oncomplete =
                resolve;

            tx.onerror =
                () =>
                    reject(
                        tx.error
                    );

        }
    );

}

/* =========================================================

function nextFilter(direction){

    currentFilter +=
        direction;

    if(
        currentFilter <
        0

        currentFilter =
            filters.length-1;

    }

    if(
        currentFilter >=
        filters.length
    ){

        currentFilter =
            0;

    }

    updateCamera();

    showFilter();

}

                event.touches[0].clientY;

    }
);


$("app").addEventListener(
    "touchend",
    event => {

        if(
            event.changedTouches.length !== 1
        ){

            return;

        }

        const x =
            event.changedTouches[0].clientX;

        const y =
            event.changedTouches[0].clientY;

        const dx =
            x-touchStartX;

        const dy =
            y-touchStartY;

        if(
            Math.abs(dx)>70 &&
            Math.abs(dx)>Math.abs(dy)
        ){

            if(
                dx < 0
            ){

                nextFilter(1);

            }else{

                nextFilter(-1);

            }

        }

    },
    {
        passive:true
    }
);

async function startCamera(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        loadingText.textContent =
            "CÂMERA NÃO SUPORTADA";

        return;

    }

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        }

        const fps =
            Number(
                $("fps").value
            );

        const resolution =
            $("resolution").value;

        let width =
            1920;

        let height =
            1080;

        if(
            resolution ===
            "3840x2160"
        ){

            width =
                3840;

            height =
                2160;

        }

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:facing,

                    width:{
                        ideal:width
                    },

                    height:{
                        ideal:height
                    },

                    frameRate:{
                        ideal:fps
                    }

                },

                audio:true

            });

        camera.srcObject =
            stream;

        await camera.play();

        loading.style.display =
            "none";

        $("status").textContent =
            facing ===
            "environment"
            ?
            "TRASEIRA"
            :
            "FRONTAL";

        updateCamera();

    }catch(error){

        console.error(error);

        loadingText.textContent =
            "PERMISSÃO DA CÂMERA NECESSÁRIA";

        showToast(
            "Permita o acesso à câmera"
        );

    }

}

/* =========================================================
   CANVAS FRAME
========================================================= */

function drawFrame(){

    if(
        !camera.videoWidth ||
        !camera.videoHeight
    ){

        return false;

    }

    canvas.width =
        camera.videoWidth;

    canvas.height =
        camera.videoHeight;

    ctx.save();

    ctx.filter =
        currentFilterCSS();

    const z =
        Number(
            $("zoom").value
        );

    const w =
        canvas.width*z;

    const h =
        canvas.height*z;

    const x =
        (canvas.width-w)/2;

    const y =
        (canvas.height-h)/2;

    ctx.drawImage(
        camera,
        x,
        y,
        w,
        h
    );

    ctx.restore();

    if(aiEnabled){

        improveImage();

    }

    return true;

}


/* =========================================================
   MELHORIA LOCAL
========================================================= */

function improveImage(){

    try{

        const image =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

        const data =
            image.data;

        for(
            let i=0;
            i<data.length;
            i+=4
        ){

            let r =
                data[i];

            let g =
                data[i+1];

            let b =
                data[i+2];

            const lum =
                .2126*r+
                .7152*g+
                .0722*b;

            if(
                lum < 65
            ){

                const boost =
                    (65-lum)*.10;

                r+=boost;
                g+=boost;
                b+=boost;

            }

            r =
                (r-128)*1.025+128;

            g =
                (g-128)*1.025+128;

            b =
                (b-128)*1.025+128;

            data[i] =
                Math.max(
                    0,
                    Math.min(
                        255,
                        r
                    )
                );

            data[i+1] =
                Math.max(
                    0,
                    Math.min(
                        255,
                        g
                    )
                );

            data[i+2] =
                Math.max(
                    0,
                    Math.min(
                        255,
                        b
                    )
                );

        }

        ctx.putImageData(
            image,
            0,
            0
        );

    }catch(error){

        console.warn(
            "AI local:",
            error
        );

    }

}

/* =========================================================

========================================================= */

$("videoButton").onclick =

async function startRecording(){

    if(
        !stream ||
        typeof MediaRecorder ===
        "undefined"
    ){

        showToast(
            "Gravação não suportada"
        );

        return;

    }

    try{

        const fps =
            Number(
                $("fps").value
            );

        const videoStream =
            camera.captureStream
            ?
            camera.captureStream(fps)
            :
            stream;

        stream
        .getAudioTracks()
        .forEach(
            track => {

                if(
                    !videoStream
                    .getAudioTracks()
                    .includes(track)
                ){

                    videoStream.addTrack(
                        track
                    );

                }

            }
        );

        let mime = "";

        const types = [

            "video/mp4;codecs=avc1",

            "video/mp4",

            "video/webm;codecs=vp9",

            "video/webm"

        ];

        for(
            const type
            of types
        ){

            if(
                MediaRecorder.isTypeSupported(
                    type
                )
            ){

                mime =
                    type;

                break;

            }

        }

        recorder =
            new MediaRecorder(
                videoStream,
                mime
                ?
                {
                    mimeType:mime
                }
                :
                undefined
            );

        chunks = [];

        recorder.ondataavailable =
            event => {

                if(
                    event.data &&
                    event.data.size
                ){

                    chunks.push(
                        event.data
                    );

                }

            };

        recorder.onstop =
            saveVideo;

        recorder.start(
            1000
        );

        recording =
            true;

        $("capture")
        .classList
        .add(
            "recording"
        );

        $("recording")
        .style
        .display =
            "block";

        $("menuButton")
        .classList
        .add(
            "hidden"
        );

        recordStarted =
            Date.now();

        recordInterval =
            setInterval(
                updateRecordTimer,
                500
            );

        showToast(
            "🎥 Gravação iniciada"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível iniciar o vídeo"
        );

    }

}


/* =========================================================
   TIMER
========================================================= */

function updateRecordTimer(){

    const seconds =
        Math.floor(
            (
                Date.now() -
                recordStarted
            )/1000
        );

    const minutes =
        Math.floor(
            seconds/60
        );

    const secondsRest =
        seconds%60;

    $("recordTime")
    .textContent =
        String(minutes)
        .padStart(2,"0")
        +
        ":"
        +
        String(secondsRest)
        .padStart(2,"0");

}


/* =========================================================
   STOP
========================================================= */

function stopRecording(){

    if(
        recorder &&
        recorder.state !==
        "inactive"
    ){

        recorder.stop();

    }

    recording =
        false;

    clearInterval(
        recordInterval
    );

    $("recording")
    .style
    .display =
        "none";

    $("capture")
    .classList
    .remove(
        "recording"
    );

}


/* =========================================================
   SAVE VIDEO
========================================================= */

async function saveVideo(){

    if(
        chunks.length === 0
    ){

        showToast(
            "Nenhum vídeo capturado"
        );

        return;

    }

    const type =
        recorder.mimeType ||
        "video/webm";

    const blob =
        new Blob(
            chunks,
            {
                type
            }
        );

    /*
       A velocidade é aplicada também
       no player/edição local.
       O arquivo original permanece
       preservado.
    */

    await saveMedia(
        blob,
        "video",
        false
    );

    showToast(
        "🎥 Vídeo salvo na galeria"
    );

    setTimeout(
        () => {

            $("menuButton")
            .classList
            .remove(
                "hidden"
            );

        },
        1000
    );

}

/* =========================================================
   RENDER GALLERY
========================================================= */

async function renderGallery(){

    galleryGrid.innerHTML =
        "";

    const items =
        await getMedia();

    const filtered =
        items.filter(
            item => {

                if(
                    galleryFilter ===
                    "all"
                ){

                    return true;

                }

                if(
                    galleryFilter ===
                    "photo"
                ){

                    return item.type ===
                        "photo";

                }

                if(
                    galleryFilter ===
                    "video"
                ){

                    return item.type ===
                        "video";

                }

                if(
                    galleryFilter ===
                    "3d"
                ){

                    return item.is3D;

                }

                return true;

            }
        );

    if(
        filtered.length === 0
    ){

        galleryGrid.innerHTML =
            `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:70px 20px;
                color:#777;
                font-size:11px;
                line-height:1.8;
            ">
                SUA GALERIA ESTÁ VAZIA<br><br>
                Capture uma foto ou importe arquivos
                do seu iPhone.
            </div>
            `;

        return;

    }

    filtered.forEach(
        item => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "galleryItem";

            const url =
                URL.createObjectURL(
                    item.blob
                );

            let media;

            if(
                item.type ===
                "photo"
            ){

                media =
                    document.createElement(
                        "img"
                    );

            }else{

                media =
                    document.createElement(
                        "video"
                    );

                media.muted =
                    true;

                media.playsInline =
                    true;

            }

            media.src =
                url;

            element.appendChild(
                media
            );

            const badge =
                document.createElement(
                    "div"
                );

            badge.className =
                "mediaType";

            badge.textContent =
                item.is3D
                ?
                "3D"
                :
                item.type ===
                "photo"
                ?
                "FOTO"
                :
                "VÍDEO";

            element.appendChild(
                badge
            );

            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "delete";

            del.textContent =
                "×";

            del.onclick =
                async event => {

                    event.stopPropagation();

                    await removeMedia(
                        item.id
                    );

                    URL.revokeObjectURL(
                        url
                    );

                    await renderGallery();

                    showToast(
                        "Arquivo removido"
                    );

                };

            element.appendChild(
                del
            );

            element.onclick =
                () => {

                    openViewer(
                        item,
                        url
                    );

                };

            galleryGrid.appendChild(
                element
            );

        }
    );

}

$("viewer3D")
.addEventListener(
    "pointermove",
    event => {

        const rect =
            $("viewer3D")
            .getBoundingClientRect();

        const x =
            (
                event.clientX -
                rect.left
            )
            /
            rect.width;

        const y =
            (
                event.clientY -
                rect.top
            )
            /
            rect.height;

        const ry =
            (
                x-.5
            )*14;

        const rx =
            (
                .5-y
            )*14;

        $("viewer3DImage")
        .style
        .setProperty(
            "--rx",
            rx+"deg"
        );

        $("viewer3DImage")
        .style
        .setProperty(
            "--ry",
            ry+"deg"
        );

    }
);

/* =========================================================
   PINCH ZOOM
========================================================= */

let pinchStart =
    0;

let zoomStart =
    1;

$("app").addEventListener(
    "touchstart",
    event => {

        if(
            event.touches.length === 2
        ){

            const a =
                event.touches[0];

            const b =
                event.touches[1];

            const dx =
                a.clientX -
                b.clientX;

            const dy =
                a.clientY -
                b.clientY;

            pinchStart =
                Math.hypot(
                    dx,
                    dy
                );

            zoomStart =
                Number(
                    $("zoom").value
                );

        }

    },
    {
        passive:true
    }
);


$("app").addEventListener(
    "touchmove",
    event => {

        if(
            event.touches.length !== 2
        ){

            return;

        }

        const a =
            event.touches[0];

        const b =
            event.touches[1];

        const dx =
            a.clientX -
            b.clientX;

        const dy =
            a.clientY -
            b.clientY;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        if(
            pinchStart <= 0
        ){

            return;

        }

        let value =
            zoomStart *
            (
                distance /
                pinchStart
            );

        value =
            Math.max(
                1,
                Math.min(
                    12,
                    value
                )
            );

        $("zoom").value =
            value;

        $("zoomValue")
        .textContent =
            value.toFixed(2);

        updateCamera();

    },
    {
        passive:true
    }
);

function restorePreferences(){

    const savedTheme =
        Number(
            localStorage.getItem(
                "rvTheme"
            )
        );

    if(
        Number.isFinite(
            savedTheme
        )
        &&
        savedTheme >= 0
        &&
        savedTheme <
        themeNames.length
    ){

        applyAppTheme(
            savedTheme,
            themeNames[
                savedTheme
            ]
        );

    }

}
